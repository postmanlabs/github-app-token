name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dylanvann/publish-github-action@v1.1.49
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
